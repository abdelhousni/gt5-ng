name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shells and tools
        run: sudo apt-get update && sudo apt-get install -y dash busybox ksh shellcheck
      - name: ShellCheck
        run: make lint
      - name: Smoke test (sh, dash, bash, busybox sh, ksh)
        run: make check
